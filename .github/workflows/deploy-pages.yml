name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the quiz
        uses: actions/checkout@v4
      - name: Check question bank
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir site
          cp index.html styles.css quiz.js math-text.js questions.js favicon.svg cnn-transformer-quiz-qr.png cnn-transformer-quiz-qr.svg site/
          touch site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

